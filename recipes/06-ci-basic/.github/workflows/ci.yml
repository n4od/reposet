  # Cheap, language-agnostic guard job. Delete it if it gets in the way.
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No merge conflict markers committed
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.md'; then
            echo "::error::Merge conflict markers found in the tree"
            exit 1
          fi
          echo "OK"

      - name: No accidental CRLF line endings
        run: |
          if git ls-files --eol | grep -E '^i/crlf' | grep -vE '\.(bat|cmd|ps1)$'; then
            echo "::error::Files committed with CRLF line endings"
            exit 1
          fi
          echo "OK"
