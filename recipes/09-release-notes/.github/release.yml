# Controls GitHub's auto-generated release notes.
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# Merge PRs with these labels and GitHub groups them for you when you publish
# a release (or when the release workflow runs `gh release create --generate-notes`).

changelog:
  # Leave these out of the notes entirely.
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - dependabot[bot]
      - github-actions[bot]

  categories:
    - title: "💥 Breaking changes"
      labels:
        - breaking
        - breaking-change
        - major

    - title: "🚀 Features"
      labels:
        - feature
        - enhancement

    - title: "🐛 Fixes"
      labels:
        - bug
        - fix

    - title: "⚡ Performance"
      labels:
        - performance

    - title: "📚 Documentation"
      labels:
        - documentation
        - docs

    - title: "🧰 Maintenance"
      labels:
        - chore
        - refactor
        - ci
        - build
        - test

    - title: "Other changes"
      labels:
        - "*"
