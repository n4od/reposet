# Dependabot — automated dependency update pull requests.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This file ships with only the github-actions ecosystem enabled, because
# that one is useful in EVERY repository. Uncomment the stack you actually use.

version: 2

updates:
  # Keeps action versions in .github/workflows/* fresh (and pinned SHAs updated).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

