name: 🐛 Bug report
description: Something in reposet or the files it installs is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        Please fill in as much detail as you can — incomplete reports are hard to act on.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched the existing issues and this is not a duplicate
          required: true
        - label: I am on the latest version (`npx reposet@latest --version`)
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - The CLI (init, list, flags)
        - Git hooks (Lefthook, gitleaks)
        - A GitHub Actions workflow
        - Issue forms or PR template
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: reposet version
      description: Run `npx reposet@latest --version` (or `npm view reposet version`).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: The output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the command you ran and its output — it will be rendered as code.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true