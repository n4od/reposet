name: Verify kit

# This workflow belongs to the KIT REPO itself. It is intentionally not part of
# any recipe, so it never gets copied into a consumer repo.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    name: Merged template is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check templates/generic against recipes/
        # Invoked via `pwsh -File` rather than `shell: pwsh`, because GitHub's
        # pwsh shell dot-sources the script and mangles arguments.
        run: pwsh -NoProfile -File ./scripts/build-templates.ps1 -Check

  yaml:
    name: Every YAML file parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Parse all YAML
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          bad = 0
          count = 0
          for p in sorted(pathlib.Path(".").rglob("*")):
              if p.is_file() and p.suffix in (".yml", ".yaml"):
                  count += 1
                  try:
                      yaml.safe_load(p.read_text(encoding="utf-8"))
                  except Exception as e:
                      bad += 1
                      print(f"::error file={p.as_posix()}::{str(e).splitlines()[0]}")

          print(f"{count} YAML files checked, {bad} failures")
          sys.exit(1 if bad else 0)
          PY

  cli:
    name: CLI tests and real tarball install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        run: node --test

      - name: Install from the packed tarball
        run: |
          set -eu
          npm pack --silent > /dev/null
          mkdir -p /tmp/e2e /tmp/target
          tar -xzf repox-*.tgz -C /tmp/e2e
          node /tmp/e2e/package/bin/repox.js init /tmp/target --yes
          test -f /tmp/target/.gitignore
          test -f /tmp/target/.gitattributes
          test -f /tmp/target/.editorconfig
          test -f /tmp/target/.github/workflows/ci.yml
          test -f /tmp/target/.githooks/commit-msg.sh
          test -x /tmp/target/.githooks/commit-msg.sh
          echo "tarball install OK"

      - name: prepack/postpack leaves nothing behind
        run: |
          rm -f repox-*.tgz
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::pack scripts left files in the working tree"
            git status --porcelain
            exit 1
          fi

  hooks:
    name: Hook scripts behave
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: commit-msg accepts valid messages and rejects invalid ones
        run: |
          set -eu
          script=recipes/10-githooks-lefthook/.githooks/commit-msg.sh
          tmp="$(mktemp -d)"

          check() {
            printf '%s\n' "$2" > "$tmp/msg"
            if sh "$script" "$tmp/msg" >/dev/null 2>&1; then code=0; else code=$?; fi
            if [ "$code" -ne "$1" ]; then
              echo "FAIL: '$2' exited $code, expected $1"
              exit 1
            fi
            echo "ok: $2"
          }

          check 0 "feat: add password reset"
          check 0 "fix(api)!: drop v1 endpoints"
          check 0 "Merge branch 'main'"
          check 0 "docs: clarify install steps"
          check 1 "added a thing"
          check 1 "FEAT: shouting"

      - name: secret fallback scanner flags a key
        run: |
          set -eu
          script=recipes/10-githooks-lefthook/.githooks/check-secrets.sh
          export SECRET_SCAN_FALLBACK=1
          tmp="$(mktemp -d)"

          echo "nothing here" > "$tmp/clean.txt"
          sh "$script" "$tmp/clean.txt" >/dev/null 2>&1 && echo "ok: clean file passes"

          echo 'key = "AKIAIOSFODNN7EXAMPLE"' > "$tmp/leak.txt"
          if sh "$script" "$tmp/leak.txt" >/dev/null 2>&1; then
            echo "FAIL: leak was not detected"
            exit 1
          fi
          echo "ok: leaked key blocked"

  hooks-windows:
    name: Git hooks work on Windows (real lefthook)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install lefthook
        run: npm i -g lefthook

      - name: Hooks block bad input and allow good input
        run: |
          set -eu
          tmp="$(mktemp -d)"
          cp -r recipes/10-githooks-lefthook/. "$tmp/"
          cd "$tmp"
          git init -q
          git config user.email ci@example.com
          git config user.name CI

          lefthook validate
          lefthook install

          printf 'hello\n' > a.txt
          git add a.txt

          if git commit -m "added stuff" >/dev/null 2>&1; then
            echo "::error::a non-conventional commit message was accepted"
            exit 1
          fi
          echo "ok: bad message blocked"

          git commit -q -m "feat: add a file"
          echo "ok: conventional message accepted"

          printf '%0.sx' $(seq 1 2000000) > big.bin
          git add big.bin
          if git commit -q -m "chore: add big file" >/dev/null 2>&1; then
            echo "::error::a 2 MB file was accepted"
            exit 1
          fi
          echo "ok: large file blocked"
          git reset -q HEAD big.bin && rm -f big.bin

          printf 'key = AKIAIOSFODNN7EXAMPLE\n' > secret.txt
          git add secret.txt
          if git commit -q -m "chore: add config" >/dev/null 2>&1; then
            echo "::error::a staged secret was accepted"
            exit 1
          fi
          echo "ok: secret blocked"

          echo "Windows hooks OK"
