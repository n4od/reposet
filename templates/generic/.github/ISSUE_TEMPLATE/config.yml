# Template chooser shown at /issues/new/choose
# Docs: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

# Forces people through a template instead of a blank textbox.
blank_issues_enabled: false

contact_links:
  - name: 💬 Questions & general discussion
    url: https://github.com/OWNER/REPO/discussions
    about: Please ask usage questions here instead of opening an issue.

  - name: 🔒 Report a security vulnerability
    url: https://github.com/OWNER/REPO/security/advisories/new
    about: Please report security issues privately. Do not open a public issue.
